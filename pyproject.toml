# To install in editable mode:
#   pip install -e ".[tools,test,lint]"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "middle-key"
version = "0.1.0"
description = "MIKE (Middle Key): programmatically capture airband traffic"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Harkleroad", email = "hark130@yahoo.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "sigmf",
]

[project.optional-dependencies]
lint = [
    "pycodestyle",  # settings: setup.cfg
    "pylint",       # settings: [tool.pylint.*] below
]
test = [
    "pytest",
]
tools = [
    "matplotlib",  # plotting in tools/; not needed by MIKE itself
]

[project.urls]
Repository = "https://github.com/hark130/middle-key"

[tool.setuptools.packages.find]
where = ["src"]

# PYLINT SETTINGS
# scripts/run_linters.sh decides what gets linted; these settings decide how.
[tool.pylint.main]
recursive = true  # lint every .py file under the directories it's given

[tool.pylint.format]
max-line-length = 100

[tool.pylint.reports]
score = false
